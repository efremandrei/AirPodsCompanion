name: Build downloadable APK release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore existing debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "Missing DEBUG_KEYSTORE_BASE64 secret"; exit 1; }
          install -d -m 700 "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Read built APK version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import re
          from pathlib import Path

          metadata = json.loads(Path("app/build/outputs/apk/debug/output-metadata.json").read_text(encoding="utf-8"))
          outputs = metadata["elements"]
          versions = {(item["versionName"], item["versionCode"]) for item in outputs}
          if len(versions) != 1:
              raise SystemExit("Expected one app version across the built APK outputs")
          version_name, version_code = versions.pop()
          if not version_name or not isinstance(version_code, int) or version_code < 1:
              raise SystemExit("Missing APK versionName or versionCode")
          safe_version = re.sub(r"[^A-Za-z0-9._-]+", "-", version_name).strip("-")
          if not safe_version:
              raise SystemExit("APK versionName contains no filename-safe characters")
          print(f"APP_VERSION={safe_version}")
          print(f"APP_BUILD={version_code}")
          PY

      - name: Prepare versioned downloadable APK
        shell: bash
        run: |
          mkdir -p release
          repo_name="${GITHUB_REPOSITORY#*/}"
          apk_path="$(find . -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)"

          if [ -z "$apk_path" ]; then
            echo "No debug APK was produced."
            find . -path '*/build/outputs/*' -type f || true
            exit 1
          fi

          versioned_apk="release/${repo_name}-v${APP_VERSION}-build-${APP_BUILD}-arm64-v8a-debug.apk"
          cp "$apk_path" "$versioned_apk"

          echo "APK_PATH=$versioned_apk" >> "$GITHUB_ENV"

      - name: Publish downloadable GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: debug-v${{ env.APP_VERSION }}
          name: CI Debug APK v${{ env.APP_VERSION }} build ${{ env.APP_BUILD }}
          body: |
            Automatically built debug APK from the latest default-branch commit.

            APK file name includes the version and build number read from the built APK metadata.
          artifacts: ${{ env.APK_PATH }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
